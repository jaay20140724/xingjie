<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星界生存小游戏服务器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors:{
                        main1:'#6320ee', main2:'#2563eb', purpleBlue:'#9370FF',
                        online:'#22c55e', offline:'#ef4444'
                    },
                    fontFamily:{'sans':['Inter','system-ui']}
                }
            }
        }
    </script>
    <style>
        *{scroll-behavior: smooth;}
        body{
            background: linear-gradient(135deg, #6320ee, #8ab4f8, #2563eb, #6320ee);
            background-size: 400% 400%;
            min-height:100vh;
            animation: gradientFlow 12s ease infinite;
            margin: 0;
            padding: 0;
        }
        @keyframes gradientFlow {
            0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%}
        }
        .glass{
            background: rgba(255,255,255,0.08) !important;
            backdrop-filter: blur(20px) !important;
            -webkit-backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(147,112,255,0.2);
            box-shadow:0 8px 32px rgba(147,112,255,0.1);
            border-radius: 0 !important;
        }
        .hover-float{transition:0.3s;}
        .hover-float:hover{transform:translateY(-6px); box-shadow:0 15px 35px rgba(147,112,255,0.2);}
        .gradient-text{color:#9370FF; font-weight:700;}
        
        .fade-in {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.9s ease, transform 0.9s ease;
        }
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .no-radius {
            border-radius: 0 !important;
        }
    </style>
</head>
<body class="text-white font-sans">

<!-- 导航栏：已使用你提供的Logo下载链接 -->
<nav class="glass fixed w-full top-0 z-50 py-3 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
            <!-- 你给的官方Logo链接 -->
            <img src="https://release-assets.githubusercontent.com/github-production-release-asset/1253988918/2701311c-23ef-4b0d-8911-3675e9aebd4d?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-06-04T14%3A05%3A08Z&rscd=attachment%3B+filename%3Dlogo2.png&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-06-04T13%3A04%3A24Z&ske=2026-06-04T14%3A05%3A08Z&sks=b&skv=2018-11-09&sig=YzyC6JpuxXbE5QHlC3MHWMXJ0UT2ts0jxM6L%2FXnEp38%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.XObNUhwnQ9YiyXJINaqR0rf3e4g-NuzDkBguISvds7U&response-content-disposition=attachment%3B%20filename%3Dlogo2.png&response-content-type=application%2Foctet-stream" 
                 alt="星界生存Logo" class="h-12 w-auto">
            <span class="text-xl font-bold gradient-text">星界生存</span>
        </div>
        <div class="hidden md:flex gap-6">
            <a href="#home" class="no-radius">首页</a>
            <a href="#servers" class="no-radius">服务器状态</a>
            <a href="#feedback" class="no-radius">玩家反馈</a>
        </div>
        <a href="https://qm.qq.com/q/aON8Bbv4E8" target="_blank" class="glass px-4 py-2 no-radius hover-float text-purpleBlue">加入QQ群</a>
    </div>
</nav>

<section id="home" class="min-h-screen flex items-center px-6 pt-24 fade-in">
    <div class="max-w-7xl mx-auto">
        <h1 class="text-5xl font-bold gradient-text" id="webTitle">星界生存小游戏服务器</h1>
        <p class="mt-4 text-lg" id="webDesc">为好玩而开，稳定、流畅、公平的小游戏服务器</p>
        <a href="#servers" class="mt-6 inline-block glass px-6 py-3 no-radius hover-float">查看服务器状态</a>
    </div>
</section>

<section id="servers" class="py-20 px-6 fade-in">
    <div class="max-w-7xl mx-auto">
        <h2 class="text-3xl font-bold gradient-text text-center mb-10">服务器实时状态</h2>
        <div class="grid md:grid-cols-3 gap-6">
            <div class="glass p-6 no-radius hover-float fade-in">
                <h3 class="text-xl font-bold" id="s1name">大厅</h3>
                <p class="mt-2 text-sm" id="s1player">在线人数：--/--</p>
                <p class="mt-3" id="s1status">加载中...</p>
            </div>
            <div class="glass p-6 no-radius hover-float fade-in">
                <h3 class="text-xl font-bold" id="s2name">生存服1</h3>
                <p class="mt-2 text-sm" id="s2player">加载中...</p>
                <p class="mt-3" id="s2status">加载中...</p>
            </div>
            <div class="glass p-6 no-radius hover-float fade-in">
                <h3 class="text-xl font-bold" id="s3name">起床单挑版</h3>
                <p class="mt-2 text-sm" id="s3player">在线人数：--/--</p>
                <p class="mt-3" id="s3status">加载中...</p>
            </div>
            <div class="glass p-6 no-radius hover-float fade-in">
                <h3 class="text-xl font-bold" id="s4name">幸运支柱</h3>
                <p class="mt-2 text-sm" id="s4player">加载中...</p>
                <p class="mt-3" id="s4status">加载中...</p>
            </div>
            <div class="glass p-6 no-radius hover-float fade-in">
                <h3 class="text-xl font-bold" id="s5name">幸运支柱-空岛版</h3>
                <p class="mt-2 text-sm" id="s5player">加载中...</p>
                <p class="mt-3" id="s5status">加载中...</p>
            </div>
        </div>
    </div>
</section>

<section id="feedback" class="py-20 px-6 fade-in">
    <div class="max-w-3xl mx-auto">
        <h2 class="text-3xl font-bold gradient-text text-center mb-10 fade-in">玩家反馈</h2>
        <div class="glass p-6 no-radius fade-in">
            <input id="email" class="w-full p-3 no-radius bg-black/30 border border-purpleBlue/30 mb-3" placeholder="请输入QQ邮箱 (xxx@qq.com)">
            <textarea id="content" class="w-full p-3 no-radius bg-black/30 border border-purpleBlue/30 mb-3" rows="4" placeholder="请输入反馈内容（至少3个字）"></textarea>
            <button onclick="sendFeedback()" class="w-full p-3 no-radius bg-gradient-to-r from-main1 to-main2 hover-float">提交反馈</button>
        </div>
        <div class="mt-10" id="feedbackList"></div>
    </div>
</section>

<footer class="py-8 glass text-center fade-in" id="footerClick">
    <p class="text-gray-300">©2025 星界生存小游戏服务器 | 为好玩而开</p>
</footer>

<div id="adminPanel" class="fixed inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-6">
    <div class="glass p-8 no-radius w-full max-w-md">
        <h2 class="text-2xl gradient-text mb-4">管理员登录</h2>
        <input id="adminUser" class="w-full p-3 no-radius bg-black/30 mb-3" placeholder="账号">
        <input id="adminPwd" class="w-full p-3 no-radius bg-black/30 mb-3" placeholder="密码" type="password">
        <button onclick="adminLogin()" class="w-full p-3 no-radius bg-gradient-to-r from-main1 to-main2 mb-6">登录</button>

        <div id="adminContent" class="hidden">
            <div id="superAdminArea">
                <h3 class="mb-3 gradient-text">官网设置</h3>
                <input id="newTitle" class="w-full p-2 mb-2 no-radius bg-black/30" placeholder="官网标题">
                <input id="newDesc" class="w-full p-2 mb-2 no-radius bg-black/30" placeholder="官网简介">

                <h3 class="mt-3 gradient-text">大厅（手动设置）</h3>
                <select id="s1stat" class="w-full p-2 mb-2 no-radius bg-black/30 text-white">
                    <option value="online">✅ 在线中</option>
                    <option value="offline">❌ 离线</option>
                </select>

                <h3 class="mt-3 gradient-text">起床单挑版（手动设置）</h3>
                <select id="s3stat" class="w-full p-2 mb-2 no-radius bg-black/30 text-white">
                    <option value="online">✅ 在线中</option>
                    <option value="offline">❌ 离线</option>
                </select>
            </div>

            <div id="normalAdminArea">
                <h3 class="mb-3 gradient-text">修改简介</h3>
                <input id="newDescNormal" class="w-full p-3 no-radius bg-black/30" placeholder="官网简介">
            </div>

            <button onclick="saveAll()" class="w-full p-3 no-radius bg-gradient-to-r from-main1 to-main2 mt-4">保存</button>
            <button onclick="showFeedbackAdmin()" class="w-full p-3 mt-2 no-radius glass">查看反馈</button>
            <div id="adminFeedbackList" class="mt-4 max-h-60 overflow-y-auto"></div>
        </div>
    </div>
</div>

<script>
const admins = {
    "Mgour145AWA": { pwd: "20140724", role: "super" },
    "lhx145": { pwd: "bb070925", role: "normal" },
    "huang1114514": { pwd: "huang1114514", role: "normal" }
};

let currentRole = "";

function loadData(){
    return JSON.parse(localStorage.getItem("serverData") || `{
        "webTitle":"星界生存小游戏服务器",
        "webDesc":"为好玩而开，稳定、流畅、公平的小游戏服务器",
        "s1stat":"online",
        "s3stat":"online"
    }`);
}
function saveData(d){localStorage.setItem("serverData",JSON.stringify(d));}

function render(){
    let d=loadData();
    document.getElementById("webTitle").innerText = d.webTitle;
    document.getElementById("webDesc").innerText = d.webDesc;

    if(d.s1stat === "online"){
        document.getElementById("s1status").innerHTML = '<span class="text-online">✅ 在线中</span>';
    }else{
        document.getElementById("s1status").innerHTML = '<span class="text-offline">❌ 离线</span>';
    }
    if(d.s3stat === "online"){
        document.getElementById("s3status").innerHTML = '<span class="text-online">✅ 在线中</span>';
    }else{
        document.getElementById("s3status").innerHTML = '<span class="text-offline">❌ 离线</span>';
    }
}
render();

async function checkJava(ip, statId, playerId){
    try{
        let r = await fetch(`https://api.mcsrvstat.us/2/${ip}`);
        let d = await r.json();
        if(d.online){
            document.getElementById(statId).innerHTML = '<span class="text-online">✅ 在线中</span>';
            document.getElementById(playerId).innerText = `在线人数：${d.players.online}/${d.players.max}`;
        }else{
            document.getElementById(statId).innerHTML = '<span class="text-offline">❌ 离线</span>';
            document.getElementById(playerId).innerText = "在线人数：0/0";
        }
    }catch(e){
        document.getElementById(statId).innerHTML = '<span class="text-offline">❌ 离线</span>';
        document.getElementById(playerId).innerText = "在线人数：0/0";
    }
}

checkJava("x3.minekuai.cn:20033", "s2status", "s2player");
checkJava("free-c2.tudouai.cn:11230", "s4status", "s4player");
checkJava("free-c4.tudouai.cn:56015", "s5status", "s5player");

setInterval(()=>{
    checkJava("x3.minekuai.cn:20033", "s2status", "s2player");
    checkJava("free-c2.tudouai.cn:11230", "s4status", "s4player");
    checkJava("free-c4.tudouai.cn:56015", "s5status", "s5player");
}, 5000);

function sendFeedback(){
    let e = document.getElementById("email").value;
    let c = document.getElementById("content").value;
    if(!e.endsWith("@qq.com")){alert("请输入有效QQ邮箱");return;}
    if(c.length<3){alert("反馈内容至少3个字");return;}
    
    let d=loadData();
    d.feedback = d.feedback || [];
    d.feedback.unshift({
        email: e,
        content: c,
        time: new Date().toLocaleString()
    });
    saveData(d);
    
    document.getElementById("email").value = "";
    document.getElementById("content").value = "";
    alert("反馈成功，等待管理员审核！");
    
    let fbList=document.getElementById("feedbackList");
    fbList.innerHTML="";
    d.feedback.forEach(f=>{
        let item=document.createElement("div");
        item.className="glass p-4 no-radius mb-3 fade-in";
        item.innerHTML=`<p class="text-purpleBlue">${f.email}</p><p class="text-white">${f.content}</p><p class="text-xs text-gray-400">${f.time}</p>`;
        fbList.appendChild(item);
    });
}

const fadeElements = document.querySelectorAll('.fade-in');
function checkVisible() {
    fadeElements.forEach(el => {
        const rect = el.getBoundingClientRect();
        const windowHeight = window.innerHeight;
        if (rect.top < windowHeight - 80) el.classList.add('visible');
    });
}
window.addEventListener('scroll', checkVisible);
window.addEventListener('load', checkVisible);

let clickCount=0;
document.getElementById("footerClick").onclick=()=>{
    clickCount++;
    if(clickCount>=5){
        clickCount=0;
        document.getElementById("adminPanel").style.display="flex";
    }
};

function adminLogin(){
    let user=document.getElementById("adminUser").value;
    let pwd=document.getElementById("adminPwd").value;
    if(!admins[user] || admins[user].pwd !== pwd){
        alert("账号或密码错误！");
        return;
    }
    currentRole = admins[user].role;
    document.getElementById("adminContent").style.display="block";
    
    let d=loadData();
    if(currentRole === "super"){
        document.getElementById("superAdminArea").style.display="block";
        document.getElementById("normalAdminArea").style.display="none";
        document.getElementById("newTitle").value=d.webTitle;
        document.getElementById("newDesc").value=d.webDesc;
        document.getElementById("s1stat").value=d.s1stat;
        document.getElementById("s3stat").value=d.s3stat;
    }else{
        document.getElementById("superAdminArea").style.display="none";
        document.getElementById("normalAdminArea").style.display="block";
        document.getElementById("newDescNormal").value=d.webDesc;
    }
}

function saveAll(){
    let d=loadData();
    if(currentRole === "super"){
        d.webTitle=document.getElementById("newTitle").value || d.webTitle;
        d.webDesc=document.getElementById("newDesc").value || d.webDesc;
        d.s1stat=document.getElementById("s1stat").value;
        d.s3stat=document.getElementById("s3stat").value;
    }else{
        d.webDesc=document.getElementById("newDescNormal").value || d.webDesc;
    }
    saveData(d);
    render();
    alert("保存成功！所有修改已生效");
}

function showFeedbackAdmin(){
    let d=loadData();
    let list=document.getElementById("adminFeedbackList");
    list.innerHTML="";
    if(!d.feedback || d.feedback.length === 0){
        list.innerHTML='<div class="text-gray-400 text-center py-2">暂无反馈</div>';
        return;
    }
    d.feedback.forEach(f=>{
        let div=document.createElement("div");
        div.className="glass p-3 mb-2 no-radius text-sm";
        div.innerText = `${f.time} | ${f.email} | ${f.content}`;
        list.appendChild(div);
    });
}
</script>
</body>
</html>
