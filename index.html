<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星界生存小游戏服务器监控</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        :root {
            --bg-main: #1a1c23;
            --bg-card: #252830;
            --bg-item: #2d3039;
            --text-color: #ffffff;
            --text-gray: #aaa;
            --color-online: #5cb85c;
            --color-offline: #d9534f;
            --color-name: #81c7ff;
            --btn-bg: #5cb85c;
            --btn-hover: #4cae4c;
        }

        .light-mode {
            --bg-main: #f5f7fa;
            --bg-card: #ffffff;
            --bg-item: #eef1f5;
            --text-color: #222222;
            --text-gray: #666;
            --color-name: #2b7cd3;
            --btn-bg: #2b7cd3;
            --btn-hover: #2269b9;
        }

        body {
            background: var(--bg-main);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            max-width: 120px;
            max-height: 120px;
            width: auto;
            height: auto;
            border-radius: 8px;
            object-fit: contain;
        }

        .title {
            font-size: 28px;
            color: var(--color-online);
        }

        .theme-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: var(--bg-item);
            color: var(--text-color);
            cursor: pointer;
            font-size: 14px;
        }

        .server-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .server-name {
            font-size: 20px;
            margin-bottom: 15px;
            color: var(--color-name);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .status-online {color: var(--color-online); font-weight: bold;}
        .status-offline {color: var(--color-offline); font-weight: bold;}

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .dot-online {background: var(--color-online);}
        .dot-offline {background: var(--color-offline);}

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .info-item {
            background: var(--bg-item);
            padding: 15px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 14px;
            color: var(--text-gray);
        }

        .info-value {
            font-size: 18px;
            font-weight: bold;
        }

        .motd {
            background: var(--bg-item);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .refresh-btn {
            display: block;
            margin: 30px auto;
            padding: 12px 30px;
            background: var(--btn-bg);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-box">
                <img class="logo" src="https://p11-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/3374884afd0b4dc2b9063e0fc0ad50c7.png" alt="LOGO">
                <h1 class="title">星界生存小游戏服务器监控</h1>
            </div>
            <button class="theme-btn" id="themeToggle">
                <i class="fas fa-moon"></i> 切换亮色模式
            </button>
        </div>

        <div id="serverList"></div>

        <button class="refresh-btn" onclick="checkAllServer()">
            <i class="fas fa-sync-alt"></i> 批量刷新状态
        </button>
    </div>

    <script>
        const serverList = [
            { name: "大厅", ip: "play.simpfun.cn", port: 21699 },
            { name: "生存服", ip: "x3.minekuai.cn", port: 20033 },
            { name: "起床服", ip: "127.0.0.1", port: 25567 },
            { name: "幸运支柱服", ip: "127.0.0.1", port: 25568 },
            { name: "空岛战争-幸运支柱版", ip: "127.0.0.1", port: 25569 }
        ];

        const themeToggle = document.getElementById("themeToggle");
        let isDark = true;
        themeToggle.addEventListener("click", () => {
            isDark = !isDark;
            document.body.classList.toggle("light-mode");
            themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i> 切换亮色模式' : '<i class="fas fa-sun"></i> 切换暗黑模式';
        });

        function renderCard(server, index) {
            return `
                <div class="server-card">
                    <div class="server-name">${server.name}</div>
                    <div class="status">
                        <div class="status-dot" id="dot${index}"></div>
                        <span id="status${index}">加载中...</span>
                    </div>
                    <div class="info-grid">
                        <div class="info-item"><div class="info-label">在线人数</div><div class="info-value" id="online${index}">--</div></div>
                        <div class="info-item"><div class="info-label">最大人数</div><div class="info-value" id="max${index}">--</div></div>
                        <div class="info-item"><div class="info-label">版本</div><div class="info-value" id="ver${index}">--</div></div>
                        <div class="info-item"><div class="info-label">延迟</div><div class="info-value" id="ping${index}">--</div></div>
                    </div>
                    <div class="motd"><div class="info-label">MOTD</div><div id="motd${index}">加载中...</div></div>
                </div>
            `;
        }

        async function checkAllServer() {
            const container = document.getElementById("serverList");
            container.innerHTML = "";
            serverList.forEach((item, idx) => { container.innerHTML += renderCard(item, idx); });

            for (let i = 0; i < serverList.length; i++) {
                const s = serverList[i];
                try {
                    const res = await fetch(`https://api.mcsrvstat.us/2/${s.ip}:${s.port}`);
                    const data = await res.json();
                    if (data.online) {
                        document.getElementById(`dot${i}`).className = "status-dot dot-online";
                        document.getElementById(`status${i}`).className = "status-online";
                        document.getElementById(`status${i}`).innerText = "在线";
                        document.getElementById(`online${i}`).innerText = data.players.online;
                        document.getElementById(`max${i}`).innerText = data.players.max;
                        document.getElementById(`ver${i}`).innerText = data.version;
                        document.getElementById(`ping${i}`).innerText = Math.round(data.ping) + "ms";
                        document.getElementById(`motd${i}`).innerText = data.motd.clean?.join(" ") || "无标语";
                    } else {
                        document.getElementById(`dot${i}`).className = "status-dot dot-offline";
                        document.getElementById(`status${i}`).className = "status-offline";
                        document.getElementById(`status${i}`).innerText = "离线";
                    }
                } catch(e) {}
            }
        }

        window.onload = checkAllServer;
    </script>
</body>
</html>
